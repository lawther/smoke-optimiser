# Fleet-managed copy of fleet payload/lint/ruff_shared.toml. Do not edit it here:
#      edit it there, then run `just sync` in fleet.
# The fleet's shared ruff configuration.
#
# This file is never read on its own: ruff does not auto-discover a file by this name.
# Each enrolled repo carries a hand-written `ruff.toml` beside it that says
# `extend = "ruff_shared.toml"` and adds whatever that repo alone needs. That per-repo
# file is NOT synced -- it is the seam this design exists to provide.
#
# Two things a per-repo ruff.toml must get right, both silent when wrong:
#   - add to `ignore` with `extend-ignore`, never `ignore`
#   - add to per-file-ignores with `extend-per-file-ignores`, never `per-file-ignores`
# The plain forms REPLACE what this file sets rather than adding to it, so the shared
# rules vanish while this file's own bytes still check out as in sync. `fleet sync
# lint-config` refuses to write a repo whose ruff.toml gets either wrong.

# Pinned rather than inferred. Ruff does infer target-version from `project.requires-python`,
# but only when a pyproject.toml sits beside the config it resolved -- and it falls back to
# py3.10 when one does not, silently. Repos that must run on 3.12 override this to py312 in
# their own ruff.toml, so 3.13-only rewrites are not suggested there: python-lint-hooks
# publishes `ml-lints` (requires-python >=3.12), and ha-scripts runs on AppDaemon's 3.12.
target-version = "py313"
line-length = 120

# Ruff 0.16 added "*.md" to its default `include`, so `ruff format` now reformats Python
# code fences inside Markdown files (e.g. re-spacing inline comments) the same as it does
# real source. Docs are docs, not code: excluding "*.md" here opts every fleet repo back
# out of that reformatting. `ruff check` already ignores Markdown regardless.
#
# `.fleet/` holds the files fleet's sync delivers and verifies by hash. Reformatting or
# fixing one in place would fail the integrity check, so no linter touches that directory. It
# is named bare, which matches it at any depth, because ruff anchors a path pattern to this
# file's directory and casey_ai keeps this file in api/, below the repo root .fleet/ sits in.
extend-exclude = ["*.md", ".fleet"]

[lint]
# ml-lints (python-lint-hooks) emits ML-prefixed codes ruff does not know about. Declaring
# them external stops RUF100 reading their `# noqa: ML001` directives as unused.
external = ["ML"]
select = ["ALL"]
ignore = [
    "COM812", # missing-trailing-comma: ruff's own docs recommend against it alongside the formatter, which already enforces this
    "CPY001", # missing-copyright-notice: the fleet does not put copyright headers on its files
    "D100",   # missing docstring in public module
    "D101",   # missing docstring in public class
    "D102",   # missing docstring in public method
    "D103",   # missing docstring in public function
    "D104",   # missing docstring in public package
    "D105",   # missing docstring in magic method
    "D107",   # missing docstring in __init__
    "EM101",  # raw-string-in-exception: exception must not use a string literal, assign to a variable first
    "EM102",  # f-string-in-exception: exception must not use an f-string literal, assign to a variable first
    "TRY003", # raise-vanilla-args: avoid specifying long messages outside the exception class
]

[lint.mccabe]
max-complexity = 15

[lint.pydocstyle]
convention = "google"

# `scripts/` is where a repo keeps its own dev scripts. These globs resolve relative to THIS FILE,
# not the working directory, and casey_ai's ruff config lives in api/ rather than at its repo
# root, so the tree sits one level up there. A `**/scripts/**` glob bridges neither layout
# (measured), and the entry that does not match in a given repo is simply inert. ar-tul moves
# casey_ai's config to its root; the `../` entry goes when it lands.
[lint.per-file-ignores]
"scripts/**" = [
    "INP001", # implicit-namespace-package: dev scripts are run by path, never imported
    "S603",   # subprocess-without-shell-equals-true: driving other tools is what these are for
    "S607",   # start-process-with-partial-path: tools are resolved via PATH, deliberately
    "T201",   # print: stdout is a script's output mechanism
]
"../scripts/**" = [
    "INP001", # implicit-namespace-package: dev scripts are run by path, never imported
    "S603",   # subprocess-without-shell-equals-true: driving other tools is what these are for
    "S607",   # start-process-with-partial-path: tools are resolved via PATH, deliberately
    "T201",   # print: stdout is a script's output mechanism
]
