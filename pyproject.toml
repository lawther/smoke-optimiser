[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smoke-optimiser"
version = "0.3.5"
requires-python = ">=3.14"
description = "A Python CLI tool and pytest plugin to identify and run a minimal smoke test suite."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mike Lawther", email = "mike.lawther@gmail.com" }]
keywords = ["pytest", "testing", "smoke-test", "coverage", "optimisation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer~=0.9",
    "pydantic~=2.0",
    # 7.9 is the first release that reads the [run] core setting the profiling rcfile names.
    "coverage~=7.9",
    "pytest~=9.0",
    "pytest-cov~=7.0",
]

[project.urls]
"Homepage" = "https://github.com/lawther/smoke-optimiser"
"Repository" = "https://github.com/lawther/smoke-optimiser"
"Bug Tracker" = "https://github.com/lawther/smoke-optimiser/issues"

[project.optional-dependencies]
machine = ["psutil~=7.0"]
dev = [
    "ruff>=0.17.3",
    "pytest",
]

[project.scripts]
smoke-optimiser = "smoke_optimiser.__main__:main"

[project.entry-points."pytest11"]
smoke_optimiser = "smoke_optimiser.plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 10
addopts = "-n auto --dist=worksteal --cov=smoke_optimiser --cov-report=term-missing --cov-branch"
filterwarnings = [
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::pytest_cov.engine.CentralCovContextWarning",
    "error::coverage.exceptions.CoverageWarning",
]

[tool.coverage.run]
branch = true
source = ["smoke_optimiser"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "def __repr__",
    "raise NotImplementedError",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/CLAUDE.md",
    "/GEMINI.md",
    "/PRD-smoke-optimiser.md",
    "/uv.lock",
    "/tests",
]

[dependency-groups]
dev = [
    "ml-lints>=0.12.4",
    "psutil>=7.2.2",
    "pytest-randomly~=5.0",
    "pytest-timeout~=2.4",
    "pytest-xdist~=3.8",
    "ruff>=0.17.3",
    "ty>=0.0.94",
]


[tool.ml-lints]
# .fleet/ holds files fleet delivers and lints at its source, at the fleet's Python floor,
# so linting them again here adds nothing and can fail on a repo pinned below that floor.
# A fleet requirement, enforced by .fleet/lint/check_lint_config.py.
extend-exclude = [".fleet"]
