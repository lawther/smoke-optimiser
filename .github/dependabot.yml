version: 2
updates:
  # Security updates only: open-pull-requests-limit 0 switches off routine version-update pull
  # requests, and the group collects this ecosystem's security fixes into one pull request.
  # The repository's "Grouped security updates" setting must stay off, because when on it
  # overrides this group.
  - package-ecosystem: "uv" # zizmor: ignore[dependabot-cooldown] -- security updates only, and GitHub applies no cooldown to those
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  # Security updates only, in the same way as the entry above.
  - package-ecosystem: "github-actions" # zizmor: ignore[dependabot-cooldown] -- security updates only, and GitHub applies no cooldown to those
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci(deps)"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
