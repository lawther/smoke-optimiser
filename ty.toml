# The fleet's shared ty configuration. Source of truth: agent_rules/lint/ty.toml.
# Do not edit this file in a target repo -- edit it here and run `just sync-lint-config`.
#
# Unlike ruff_shared.toml, this file IS what each repo reads: it is deployed as `ty.toml`
# at the repo's config directory and ty discovers it there. There is no per-repo seam,
# because ty has no `extend` -- a ty.toml carrying one is rejected outright:
#
#   unknown field `extend`, expected one of `environment`, `src`, `rules`, `terminal`,
#   `analysis`, `overrides`
#
# Upstream asks for it in https://github.com/astral-sh/ty/issues/2137, folded into
# https://github.com/astral-sh/ty/issues/175 and milestoned ty-1.1, with no PR in flight.
# ar-5n4 splits this into ty_shared.toml plus a per-repo ty.toml the day it lands, matching
# the ruff half; check_ty_extend.py is what will notice. Until then, a repo needing its own
# ty settings cannot be enrolled in the ty half of this family.
#
# A ty.toml REPLACES `[tool.ty]` in pyproject.toml outright -- there is no merge -- so an
# enrolled repo must have those tables deleted, not merely left unused. sync_lint_config.py
# refuses to write a repo that still carries them.

[rules]
# A submodule that may not exist is an import that may fail at runtime, not a style matter.
possibly-missing-submodule = "error"

# `unused-ignore-comment`, NOT `unused-type-ignore-comment`. The latter is what four fleet
# repos declared, and it does nothing: ty accepts it WITHOUT an unknown-rule warning (it does
# warn for a genuinely bogus name), so the config read as enforced and was not. Measured on
# ty 0.0.78; see ar-v8r. Syncing this file is what fixes it fleet-wide.
#
# With this on, a suppression that no longer suppresses anything fails the build instead of
# rotting. Note ty ignores mypy-style `# type: ignore` entirely -- a real suppression must be
# spelled `# ty: ignore[rule-id]`, which is what makes ar-8q5's 66 dead comments worth sorting
# out rather than bulk-deleting.
unused-ignore-comment = "error"
